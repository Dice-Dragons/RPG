<xf:title>{{ phrase('cv6_rpg_sort_publishers') }}</xf:title>

<xf:macro template="public:nestable_macros" name="setup" />

<xf:form action="{{ link('rpg/publisher/sort') }}" class="block" ajax="true">
	<div class="block-container">
		<div class="block-body">
			<div class="nestable-container" data-xf-init="nestable" data-max-depth="1" data-value-function="serialize">
				<xf:macro name="publisher_list" arg-publishers="{$publisher}" />
				<xf:hiddenval name="publishers" value="" />
			</div>
		</div>
		<xf:submitrow icon="save" rowtype="simple" />
	</div>
</xf:form>

<xf:macro name="publisher_list" arg-publishers="!">
	<ol class="nestable-list">
		<xf:foreach loop="$publishers" key="$id" value="$publisher">
			<li class="nestable-item" data-id="{$id}">
				<div class="nestable-handle" aria-label="{{ phrase('drag_handle')|for_attr }}"><xf:fa icon="fa-bars" /></div>
				<div class="nestable-content">
					<strong>{{ $publisher.title }}</strong>
				</div>
			</li>
		</xf:foreach>
	</ol>
</xf:macro>
